[project]
name = "study-forge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pymupdf",
  "pillow",
  "httpx",
  "pydantic",
  "latex2mathml>=3.81.1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "respx"]

[tool.ruff]
line-length = 100
extend-exclude = ["diagram-design/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
