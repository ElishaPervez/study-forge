[project]
name = "lesson-generator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pymupdf",
  "pillow",
  "httpx",
  "pydantic",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "respx"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
